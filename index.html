<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanishq Shivasharan — Terminal Portfolio</title>
    <meta name="description" content="Cybersecurity developer & web engineer. Interactive terminal portfolio." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
<div id="app">
  <div class="tbar">
    <div class="dot dr"></div>
    <div class="dot dy"></div>
    <div class="dot dg"></div>
    <span class="btitle">tanishq@portfolio ~ bash [AI-powered]</span>
  </div>

  <div class="tbody" id="out"></div>

  <div class="irow">
    <span class="pp">
      tanishq<span class="at">@</span>portfolio<span class="at">:</span><span class="pth">~</span><span class="at">$</span>
    </span>
    <input id="ci" type="text"
      autocomplete="off" autocorrect="off"
      autocapitalize="off" spellcheck="false"
      placeholder="type a command or ask me anything..." />
  </div>
</div>

<script src="js/commands.js"></script>
<script src="js/data.js"></script>
<script src="js/terminal.js"></script>
</body>

</html>
